# GTEMS OS GRUB2 Bootloader Configuration (BIOS & UEFI)
# «Diseñado por cinco mentes, construido para el futuro.»

set default="0"
set timeout=5
set gfxmode=auto
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod png

# Aurora Color Theme
set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan

menuentry "GTEMS OS 1.0 Aurora (Kernel Linux x86_64)" {
    search --no-floppy --set=root --label GTEMS_ROOT
    linux /boot/vmlinuz-gtems root=LABEL=GTEMS_ROOT ro quiet splash loglevel=3 systemd.show_status=auto
    initrd /boot/initramfs-gtems.img
}

menuentry "GTEMS OS 1.0 Aurora (Modo de Recuperación / Consola)" {
    search --no-floppy --set=root --label GTEMS_ROOT
    linux /boot/vmlinuz-gtems root=LABEL=GTEMS_ROOT ro single nomodeset
    initrd /boot/initramfs-gtems.img
}

menuentry "GTEMS OS Live — Probar o Instalar desde Medio Extraíble" {
    search --no-floppy --set=root --label GTEMS_ISO
    linux /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}
